        <script>
            let sqlflow;
            let editor;
            let currentSql = '';
            let currentData = null;
            
            async function analyzeSql(type = 'lineage') {
                const dbType = document.getElementById('dbType').value;
                const sqlText = document.getElementById('sqlInput').value;
                currentSql = sqlText;
                const errorDiv = document.getElementById('error');
                const analyzeBtn = document.getElementById('analyzeBtn');
                const erBtn = document.getElementById('erBtn');
                
                errorDiv.style.display = 'none';
                analyzeBtn.disabled = true;
                erBtn.disabled = true;
                
                try {
                    const response = await fetch('/analyze', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            dbType: dbType,
                            sql: sqlText,
                            type: type
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        if (data.errors) {
                            // 处理详细的错误信息
                            const errorMessages = data.errors.map(err => {
                                const location = err.line && err.column ? 
                                    `<span class="error-location" data-line="${err.line}" data-column="${err.column}">[Line ${err.line}, Column ${err.column}]</span>` : '';
                                return `${location} ${err.message}`;
                            }).join('\n');
                            
                            errorDiv.innerHTML = errorMessages;
                            errorDiv.style.display = 'block';
                            
                            // 添加错误位置点击事件
                            const errorLocations = errorDiv.querySelectorAll('.error-location');
                            errorLocations.forEach(location => {
                                location.style.cursor = 'pointer';
                                location.style.color = '#0366d6';
                                location.style.textDecoration = 'underline';
                                location.addEventListener('click', () => {
                                    const line = parseInt(location.dataset.line);
                                    const column = parseInt(location.dataset.column);
                                    highlightError(line, column);
                                });
                            });
                            return;
                        } else {
                            errorDiv.textContent = data.error || 'Analysis failed';
                            errorDiv.style.display = 'block';
                            return;
                        }
                    }
                    
                    const options = {
                        layout: true,
                        onNodeClick: handleNodeClick,
                        onEdgeClick: handleEdgeClick,
                        onContextMenu: handleContextMenu
                    };
                    
                    sqlflow.visualizeJSON(data, options);
                    highlightSqlForNode(null);
                    
                } catch (error) {
                    errorDiv.textContent = error.message;
                    errorDiv.style.display = 'block';
                } finally {
                    analyzeBtn.disabled = false;
                    erBtn.disabled = false;
                }
            }
            
            function handleNodeClick(node) {
                if (node && (node.name || node.text)) {
                    const columnName = node.name || node.text;
                    const table = node.table || node.parent;
                    highlightSqlForNode(columnName, table);
                } else {
                    highlightSqlForNode(null);
                }
            }
            
            function handleEdgeClick(edge) {
                if (edge && edge.text) {
                    highlightSqlForNode(edge.text);
                } else {
                    highlightSqlForNode(null);
                }
            }
            
            function handleContextMenu(event, element) {
                event.preventDefault();
                
                // 移除已存在的菜单
                const existingMenu = document.querySelector('.context-menu');
                if (existingMenu) {
                    document.body.removeChild(existingMenu);
                }
                
                // 创建菜单容器
                const menu = document.createElement('div');
                menu.className = 'context-menu';
                menu.style.left = `${event.pageX}px`;
                menu.style.top = `${event.pageY}px`;
                
                // 定义菜单项
                const menuItems = [];
                
                // 根据节点类型添加不同的菜单项
                if (element) {
                    if (element.table || (!element.name && element.text)) {
                        // 表级别的菜单项
                        menuItems.push(
                            { text: 'Show table to the leftmost', action: () => showTableToLeft(element) },
                            { text: 'Show table lineage', action: () => showTableLineage(element) },
                            { text: 'List table columns', action: () => listTableColumns(element) }
                        );
                    }
                    
                    if (element.name) {
                        // 列级别的菜单项
                        menuItems.push(
                            { text: 'Show column to the leftmost', action: () => showColumnToLeft(element) },
                            { text: 'Show column lineage', action: () => showColumnLineage(element) }
                        );
                    }
                }
                
                // 添加下载选项
                menuItems.push(
                    { text: 'Download as PNG', action: () => downloadAsPNG() },
                    { text: 'Download as JSON', action: () => downloadAsJSON() },
                    { text: 'Download as CSV', action: () => downloadAsCSV() }
                );
                
                // 创建菜单项
                menuItems.forEach(item => {
                    const menuItem = document.createElement('div');
                    menuItem.className = 'context-menu-item';
                    menuItem.textContent = item.text;
                    menuItem.onclick = () => {
                        item.action();
                        document.body.removeChild(menu);
                    };
                    menu.appendChild(menuItem);
                });
                
                // 添加菜单到页面
                document.body.appendChild(menu);
                
                // 点击其他地方时关闭菜单
                const closeMenu = (e) => {
                    if (!menu.contains(e.target)) {
                        document.body.removeChild(menu);
                        document.removeEventListener('click', closeMenu);
                    }
                };
                
                // 延迟添加事件监听器，避免立即触发
                setTimeout(() => {
                    document.addEventListener('click', closeMenu);
                }, 0);
            }
            
            // 菜单项功能实现
            async function showTableToLeft(element) {
                if (!element || (!element.table && !element.text)) return;
                const tableName = element.table || element.text;
                
                try {
                    const response = await fetch('/graph/table-lineage', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ table: tableName })
                    });
                    
                    const data = await response.json();
                    if (data.error) {
                        console.error('Error:', data.error);
                        return;
                    }
                    
                    // 更新图形显示
                    sqlflow.visualizeJSON(data, {
                        layout: true,
                        onNodeClick: handleNodeClick,
                        onEdgeClick: handleEdgeClick,
                        onContextMenu: handleContextMenu
                    });
                } catch (error) {
                    console.error('Error:', error);
                }
            }
            
            async function showColumnToLeft(element) {
                if (!element || !element.name) return;
                
                try {
                    const response = await fetch('/graph/column-lineage', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            table: element.table,
                            column: element.name
                        })
                    });
                    
                    const data = await response.json();
                    if (data.error) {
                        console.error('Error:', data.error);
                        return;
                    }
                    
                    // 更新图形显示
                    sqlflow.visualizeJSON(data, {
                        layout: true,
                        onNodeClick: handleNodeClick,
                        onEdgeClick: handleEdgeClick,
                        onContextMenu: handleContextMenu
                    });
                } catch (error) {
                    console.error('Error:', error);
                }
            }

                    const data = await response.json();

                        return;
                    }
                    
                    // 更新图形显示
                    sqlflow.visualizeJSON(data, {

                        onContextMenu: handleContextMenu
                    });
                } catch (error) {
                    console.error('Error:', error);
                }
            }
            
            async function showColumnLineage(element) {
                if (!element || !element.name) return;
                
                try {
                    const response = await fetch('/graph/column-lineage', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            table: element.table,
                            column: element.name
                        })
                    });
                    
                    const data = await response.json();
                    if (data.error) {
                        console.error('Error:', data.error);
                        return;
                    }
                    
                    // 更新图形显示
                    sqlflow.visualizeJSON(data, {
                        layout: true,
                        onNodeClick: handleNodeClick,
                        onEdgeClick: handleEdgeClick,
                        onContextMenu: handleContextMenu
                    });
                } catch (error) {
                    console.error('Error:', error);
                }
            }
            
            async function listTableColumns(element) {
                if (!element || (!element.table && !element.text)) return;
                const tableName = element.table || element.text;
                
                try {
                    const response = await fetch('/graph/table-columns', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ table: tableName })
                    });
                    
                    const columns = await response.json();
                    if (columns.error) {
                        console.error('Error:', columns.error);
                        return;
                    }
                    
                    // 创建列信息弹窗
                    const dialog = document.createElement('div');
                    dialog.className = 'column-dialog';
                    
                    const title = document.createElement('h3');
                    title.textContent = `Columns in table ${tableName}`;
                    dialog.appendChild(title);
                    
                    const columnList = document.createElement('ul');
                    columns.forEach(column => {
                        const item = document.createElement('li');
                        item.textContent = `${column.name}${column.dataType ? ` (${column.dataType})` : ''}`;
                        columnList.appendChild(item);
                    });
                    dialog.appendChild(columnList);
                    
                    const closeButton = document.createElement('button');
                    closeButton.textContent = 'Close';
                    closeButton.onclick = () => document.body.removeChild(dialog);
                    dialog.appendChild(closeButton);
                    
                    document.body.appendChild(dialog);
                } catch (error) {
                    console.error('Error:', error);
                }
            }
            
            function highlightBackwards(element) {
                if (element && (element.name || element.text)) {
                    const columnName = element.name || element.text;
                    const table = element.table || element.parent;
                    highlightSqlForNode(columnName, table, true);
                }
            }
            
            function highlightForwards(element) {
                if (element && (element.name || element.text)) {
                    const columnName = element.name || element.text;
                    const table = element.table || element.parent;
                    highlightSqlForNode(columnName, table, false);
                }
            }
            
            // 下载功能实现
            function downloadAsPNG() {
                const svg = document.querySelector('svg');
                if (!svg) {
                    console.error('No SVG element found');
                    return;
                }
                
                const canvas = document.createElement('canvas');
                const box = svg.getBoundingClientRect();
                canvas.width = box.width;
                canvas.height = box.height;
                
                const ctx = canvas.getContext('2d');
                const data = (new XMLSerializer()).serializeToString(svg);
                const DOMURL = window.URL || window.webkitURL || window;
                
                const img = new Image();
                const svgBlob = new Blob([data], {type: 'image/svg+xml;charset=utf-8'});
                const url = DOMURL.createObjectURL(svgBlob);
                
                img.onload = function () {
                    ctx.drawImage(img, 0, 0);
                    DOMURL.revokeObjectURL(url);
                    
                    const imgURL = canvas.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = imgURL;
                    a.download = 'lineage-graph.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };
                
                img.src = url;
            }
            
            function downloadAsJSON() {
                const graphData = sqlflow.getGraphData();
                const dataStr = JSON.stringify(graphData, null, 2);
                const blob = new Blob([dataStr], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'lineage-graph.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            
            function downloadAsCSV() {
                const graphData = sqlflow.getGraphData();
                let csv = 'Source,Target,Type\n';
                
                if (graphData && graphData.edges) {
                    graphData.edges.forEach(edge => {
                        const source = graphData.nodes.find(n => n.id === edge.source);
                        const target = graphData.nodes.find(n => n.id === edge.target);
                        if (source && target) {
                            csv += `${source.text || source.name},${target.text || target.name},${edge.type || 'default'}\n`;
                        }
                    });
                }
                
                const blob = new Blob([csv], {type: 'text/csv'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'lineage-graph.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            
            function highlightSqlForNode(columnName, table, backwards = false) {
                const sqlInput = document.getElementById('sqlInput');
                const sqlHighlightDiv = document.getElementById('sqlHighlight');
                let sql = currentSql;
                
                if (!columnName) {
                    sqlHighlightDiv.style.display = 'none';
                    sqlInput.style.display = 'block';
                    return;
                }
                
                // 转义正则表达式特殊字符
                columnName = columnName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                
                // 创建一个临时div来转义HTML
                const tempDiv = document.createElement('div');
                tempDiv.textContent = sql;
                let escapedSql = tempDiv.innerHTML;
                
                // 构建匹配模式
                let pattern;
                if (table) {
                    // 如果有表名，匹配 表名.列名 或者 别名.列名 的模式
                    pattern = new RegExp(`(${table}\\.|[a-zA-Z0-9_]+\\.)?${columnName}\\b`, 'g');
                } else {
                    // 否则只匹配列名
                    pattern = new RegExp(`\\b${columnName}\\b`, 'g');
                }
                
                // 高亮匹配的文本
                escapedSql = escapedSql.replace(pattern, match => {
                    return `<span class="highlight">${match}</span>`;
                });
                
                // 添加行号和保持缩进
                const lines = escapedSql.split('\n');
                const highlightedLines = lines.map((line, i) => {
                    const lineNumber = i + 1;
                    const paddedNumber = String(lineNumber).padStart(3, ' ');
                    return `<span class="line-number">${paddedNumber}</span>${line}`;
                });
                
                // 更新显示
                sqlHighlightDiv.innerHTML = highlightedLines.join('\n');
                sqlHighlightDiv.style.display = 'block';
                sqlInput.style.display = 'none';
                
                // 找到第一个高亮的位置并滚动到那里
                const highlights = sqlHighlightDiv.querySelectorAll('.highlight');
                if (highlights.length > 0) {
                    const targetHighlight = backwards ? highlights[0] : highlights[highlights.length - 1];
                    targetHighlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            function updateLineNumbers() {
                const sqlInput = document.getElementById('sqlInput');
                const lineNumbers = document.querySelector('.line-numbers');
                const lines = sqlInput.value.split('\n');
                
                lineNumbers.innerHTML = '';
                lineNumbers.style.paddingTop = '10px';
                
                lines.forEach((_, i) => {
                    const div = document.createElement('div');
                    div.className = 'line-number';
                    div.textContent = i + 1;
                    lineNumbers.appendChild(div);
                });
            }

            function highlightError(line, column) {
                const sqlInput = document.getElementById('sqlInput');
                const lines = sqlInput.value.split('\n');
                
                // 清除现有的高亮
                const existingHighlights = document.querySelectorAll('.error-highlight');
                existingHighlights.forEach(el => el.remove());
                
                if (line > 0 && line <= lines.length) {
                    const lineText = lines[line - 1];
                    const fontSize = parseFloat(getComputedStyle(sqlInput).fontSize);
                    const lineHeight = fontSize * 1.5; // line-height
                    const charWidth = fontSize * 0.6; // 假设等宽字体下每个字符宽度
                    
                    const highlight = document.createElement('div');
                    highlight.className = 'error-highlight';
                    highlight.style.top = `${10 + (line - 1) * lineHeight}px`;
                    highlight.style.left = `${50 + (column - 1) * charWidth}px`;
                    highlight.style.width = `${charWidth}px`;
                    highlight.style.height = `${lineHeight}px`;
                    
                    document.querySelector('.sql-editor-wrapper').appendChild(highlight);
                    
                    // 滚动到错误位置
                    sqlInput.focus();
                    const linePosition = (line - 1) * lineHeight;
                    sqlInput.scrollTop = linePosition - sqlInput.clientHeight / 2;
                    
                    // 设置光标位置
                    const pos = lines.slice(0, line - 1).join('\n').length + column;
                    sqlInput.setSelectionRange(pos - 1, pos);
                }
            }

            document.addEventListener('DOMContentLoaded', async () => {
                // 添加拖动调整功能
                const resizer = document.getElementById('dragMe');
                const leftPanel = document.querySelector('.left-panel');
                
                let x = 0;
                let leftWidth = 0;
                
                const mouseDownHandler = function(e) {
                    x = e.clientX;
                    leftWidth = leftPanel.getBoundingClientRect().width;
                    
                    document.addEventListener('mousemove', mouseMoveHandler);
                    document.addEventListener('mouseup', mouseUpHandler);
                };
                
                const mouseMoveHandler = function(e) {
                    const dx = e.clientX - x;
                    const newLeftWidth = leftWidth + dx;
                    
                    if (newLeftWidth > 200 && newLeftWidth < window.innerWidth - 200) {
                        leftPanel.style.width = `${newLeftWidth}px`;
                    }
                };
                
                const mouseUpHandler = function() {
                    document.removeEventListener('mousemove', mouseMoveHandler);
                    document.removeEventListener('mouseup', mouseUpHandler);
                };
                
                resizer.addEventListener('mousedown', mouseDownHandler);
                // 添加SQL输入框的事件监听
                const sqlInput = document.getElementById('sqlInput');
                sqlInput.addEventListener('input', updateLineNumbers);
                sqlInput.addEventListener('scroll', () => {
                    const lineNumbers = document.querySelector('.line-numbers');
                    lineNumbers.scrollTop = sqlInput.scrollTop;
                });
                
                // 初始化行号
                updateLineNumbers();
                sqlflow = await SQLFlow.init({
                    container: document.getElementById('sqlflow'),
                    width: '100%',
                    height: '100%',
                    apiPrefix: '',
                    component: {
                        sqlEditor: false,
                        graphLocate: true,
                        minimap: true,
                    },
                });
                
                const options = {
                    layout: true,
                    onNodeClick: handleNodeClick,
                    onEdgeClick: handleEdgeClick,
                    onContextMenu: handleContextMenu
                };
                
                // 初始化血缘图
                const response = await fetch('/json/lineageGraph.json');
                const data = await response.json();
                currentData = data;  // 保存数据供后续使用
                sqlflow.visualizeJSON(data, options);
            });
        </script>

                overflow: hidden;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            #sqlflow {
                width: 100%;
                height: 100%;
                border: none;
            }

            .controls {
                margin-bottom: 10px;
                display: flex;
                gap: 10px;
            }

            select, button {
                padding: 8px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
            }

            button {
                background-color: #4CAF50;
                color: white;
                border: none;
                cursor: pointer;
            }

            button:hover {
                background-color: #45a049;
            }

            button:disabled {
                background-color: #cccccc;
                cursor: not-allowed;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="left-panel">
                <div class="controls">
                    <select id="dbType">
                        <option value="oracle">Oracle</option>
                        <option value="mysql">MySQL</option>
                        <option value="postgresql">PostgreSQL</option>
                        <option value="sqlserver">SQL Server</option>
                        <option value="hive">Hive</option>
                        <option value="snowflake">Snowflake</option>
                        <option value="db2">DB2</option>
                        <option value="greenplum">Greenplum</option>
                        <option value="informix">Informix</option>
                        <option value="netezza">Netezza</option>
                        <option value="redshift">Redshift</option>
                        <option value="sybase">Sybase</option>
                        <option value="teradata">Teradata</option>
                    </select>
                    <button id="analyzeBtn" onclick="analyzeSql('lineage')">血缘分析</button>
                    <button id="erBtn" onclick="analyzeSql('er')">生成ER图</button>
                </div>
                <div class="sql-container">
                    <div class="sql-editor-container">
                        <div class="sql-editor-wrapper">
                            <div class="line-numbers"></div>
                            <textarea id="sqlInput" placeholder="Enter your SQL here..." spellcheck="false"></textarea>
                        </div>
                    </div>
                    <div id="sqlHighlight"></div>
                    <div id="error"></div>
                </div>
            </div>
            <div class="resizer" id="dragMe"></div>
            <div class="right-panel">
                <div class="graph-container">
                    <div id="sqlflow"></div>
                </div>
            </div>
        </div>
    </body>
</html>
